<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steward Incident Manager - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0b0d10;
            --bg-panel: #14181f;
            --border: #2a3241;
            --accent-red: #e10600;
            --accent-blue: #3b82f6;
            --accent-green: #41BD22;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .login-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-top: 3px solid var(--accent-blue);
            border-radius: 8px;
            padding: 2.25rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.25rem; text-align:center;}
        h3 { font-size: 18px; letter-spacing: 1px; margin-bottom: 0.25rem;  text-align:center;}
        p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.75rem;  text-align:center;}
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; }
        input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: var(--accent-blue); }
        button {
            width: 100%;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 0.85rem;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover { background: var(--accent-green); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            background: rgba(225, 6, 0, 0.15);
            border: 1px solid var(--accent-red);
            color: #ff8080;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
     <div class="login-card">
    	
    	  <h3>S<span style="color:var(--accent-blue);">(i)</span>M <span style="font-size:12px; color:var(--text-muted);">v1.0</span></h3>
        <h1>Steward Incident Manager</h1>
        <p>Sign in to manage incident reports.</p>
        <div id="errorBox" class="error-msg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" id="submitBtn">Sign In</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = '__SUPABASE_URL_PLACEHOLDER__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY_PLACEHOLDER__';
        
        
        
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Redirect if already logged in
        async function checkExistingSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'admin.html';
            }
        }
        checkExistingSession();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                errorBox.textContent = error.message;
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            } else {
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
